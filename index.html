<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <title>Reuni Akbar - Registrasi Peserta</title>
  <meta name="description" content="Formulir registrasi peserta Reuni Akbar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="event-title">
      <div class="brand-mark" aria-hidden="true">
        <span>RA</span>
      </div>
      <p class="eyebrow">Registrasi Peserta</p>
      <h1 id="event-title">Reuni Akbar</h1>
      <p class="event-meta">Bertemu kembali, kenangan tetap hidup.</p>
    </section>

    <section class="form-section" aria-label="Form registrasi">
      <form id="registrationForm" novalidate>
        <div class="field">
          <label for="name">Nama lengkap</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Contoh: Ahmad Fauzi" required>
          <p class="error" id="nameError"></p>
        </div>

        <div class="field">
          <label for="graduationYear">Angkatan</label>
          <select id="graduationYear" name="graduationYear" required>
            <option value="" selected disabled>Pilih angkatan</option>
            <option value="60">60</option>
            <option value="61">61</option>
            <option value="62">62</option>
            <option value="63">63</option>
            <option value="64">64</option>
            <option value="65">65</option>
            <option value="66">66</option>
            <option value="67">67</option>
            <option value="68">68</option>
            <option value="69">69</option>
            <option value="70">70</option>
            <option value="71">71</option>
            <option value="72">72</option>
            <option value="73">73</option>
            <option value="74">74</option>
            <option value="75">75</option>
            <option value="76">76</option>
            <option value="77">77</option>
            <option value="78">78</option>
            <option value="79">79</option>
            <option value="80">80</option>
            <option value="81">81</option>
            <option value="82">82</option>
            <option value="83">83</option>
            <option value="84">84</option>
            <option value="85">85</option>
            <option value="86">86</option>
            <option value="87">87</option>
            <option value="88">88</option>
            <option value="89">89</option>
            <option value="90">90</option>
            <option value="91">91</option>
            <option value="92">92</option>
            <option value="93">93</option>
            <option value="94">94</option>
            <option value="95">95</option>
            <option value="96">96</option>
            <option value="97">97</option>
            <option value="98">98</option>
            <option value="99">99</option>
            <option value="2000">2000</option>
            <option value="2001">2001</option>
            <option value="2002">2002</option>
            <option value="2003">2003</option>
            <option value="2004">2004</option>
            <option value="2005">2005</option>
            <option value="2006">2006</option>
            <option value="2007">2007</option>
            <option value="2008">2008</option>
            <option value="2009">2009</option>
            <option value="2010">2010</option>
            <option value="2011">2011</option>
            <option value="2012">2012</option>
            <option value="2013">2013</option>
            <option value="2014">2014</option>
            <option value="2015">2015</option>
            <option value="2016">2016</option>
            <option value="2017">2017</option>
            <option value="2018">2018</option>
            <option value="2019">2019</option>
            <option value="2020 ke atas">2020 ke atas</option>
          </select>
          <p class="error" id="graduationYearError"></p>
        </div>

        <div class="field">
          <label for="phone">Nomor HP</label>
          <div class="phone-input">
            <span>+62</span>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="81234567890" required>
          </div>
          <p class="error" id="phoneError"></p>
        </div>

        <label class="consent">
          <input id="consent" name="consent" type="checkbox">
          <span>Saya setuju data digunakan untuk keperluan reuni.</span>
        </label>

        <button class="submit-button" type="submit">
          <span>Daftar Sekarang</span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </button>
      </form>

      <p class="privacy-note">Data hanya digunakan untuk pendaftaran reuni.</p>
    </section>
  </main>

  <dialog id="successDialog" class="success-dialog">
    <div class="success-icon" aria-hidden="true">&#10003;</div>
    <p class="dialog-kicker">Pendaftaran berhasil</p>
    <h2>Nomor Undian Anda</h2>
    <div class="raffle-number" id="raffleNumber">RA-0000</div>
    <p class="dialog-message" id="dialogMessage">Simpan nomor ini untuk doorprize.</p>
    <div class="dialog-actions">
      <a id="whatsappLink" class="whatsapp-button" href="#" target="_blank" rel="noopener">
        Kirim ke WhatsApp
</a>
      <button id="closeDialog" class="close-button" type="button">Tutup</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
